[project]
name = "chatbot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "DoanhPD", email = "doanhpd@reactplus.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "langchain-ollama>=1.0",
    "langchain-google-genai>=4.0",
    "pydantic-settings>=2.0",
    "psycopg[binary]>=3.3.9",
    "sqlalchemy[asyncio]>=2.1.9",
    "uvicorn>=0.30",
    "alembic>=1.20.1",
    "boto3>=1.44.11",
]

[project.scripts]
chatbot = "chatbot:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
