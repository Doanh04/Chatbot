name: chatbot

services:
  app:
    build: ./ChatBot
    environment:
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3-vi:latest}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL_35_FLASH_LITE: ${GEMINI_MODEL_35_FLASH_LITE:-gemini-3.5-flash-lite}
      GEMINI_MODEL_31_FLASH_LITE: ${GEMINI_MODEL_31_FLASH_LITE:-gemini-3.1-flash-lite}
      GEMINI_MODEL_GEMMA_4_26B: ${GEMINI_MODEL_GEMMA_4_26B:-gemma-4-26b-a4b-it}
      GEMINI_MODEL_GEMMA_4_31B: ${GEMINI_MODEL_GEMMA_4_31B:-gemma-4-31b-it}
      GEMINI_DEFAULT_MODEL: ${GEMINI_DEFAULT_MODEL:-gemini-3.5-flash-lite}
      R2_BUCKET: ${R2_BUCKET:?Set R2_BUCKET in .env}
      R2_ENDPOINT: ${R2_ENDPOINT:?Set R2_ENDPOINT in .env}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:?Set R2_ACCESS_KEY_ID in .env}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:?Set R2_SECRET_ACCESS_KEY in .env}
      DB_HOST: postgres-db
      DB_PORT: "5432"
      DB_NAME: chatbot
      DB_USER: chatbot
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres-db:
        condition: service_healthy

  backend:
    build: ./BackendChatbot
    environment:
      AUTH_JWT_SECRET_BASE64: ${AUTH_JWT_SECRET_BASE64:?Set AUTH_JWT_SECRET_BASE64 in .env}
      DB_HOST: postgres-db
      DB_PORT: "5432"
      DB_NAME: chatbot
      DB_USER: chatbot
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "8080:8080"
    depends_on:
      postgres-db:
        condition: service_healthy

  postgres-db:
    image: postgres:17
    environment:
      POSTGRES_DB: chatbot
      POSTGRES_USER: chatbot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatbot -d chatbot"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
